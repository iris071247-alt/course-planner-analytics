<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能选课助手 · 访客分析</title><link rel="stylesheet" href="/admin.css"></head><body><section id="login" class="login panel"><h1>智能选课助手</h1><h2>访客分析 · 管理员入口</h2><p class="muted">请输入后台管理员密码查看匿名统计数据。</p><form id="login-form"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button>安全登录</button></form><p id="error" class="danger"></p></section><div id="app" hidden><header><div><h1>访客分析控制台</h1><p>上海政法学院 · 智能选课规划助手</p></div><div class="toolbar"><select id="days" aria-label="选择日期"><option value="1">最近24小时</option><option value="7" selected>最近7天</option><option value="30">最近30天</option><option value="90">最近90天</option></select><button id="refresh">刷新</button><button id="export">导出CSV</button><button id="logout" class="secondary">退出</button></div></header><main><p class="muted">数据从追踪脚本正式接入且符合隐私要求后开始记录。使用匿名访客标识；PV 不等于实际人数。</p><section class="metrics" id="metrics"></section><section class="layout"><article class="panel"><h2>每日浏览趋势</h2><div id="daily"></div></article><article class="panel"><h2>访问设备</h2><div id="devices"></div></article><article class="panel"><h2>功能使用次数</h2><div id="actions"></div></article><article class="panel"><h2>转化漏斗（各步骤独立去重）</h2><div id="funnel"></div></article><article class="panel wide"><h2>访问来源</h2><div id="sources"></div></article><article class="panel wide"><h2>最近匿名访客事件</h2><div class="scroll"><table><thead><tr><th>时间（UTC）</th><th>访客标识</th><th>事件</th><th>页面</th><th>设备</th></tr></thead><tbody id="events"></tbody></table></div></article></section></main></div><script defer src="/admin.js"></script></body></html>
