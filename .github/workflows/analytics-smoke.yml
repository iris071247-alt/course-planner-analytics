name: Analytics production smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analytics-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTP health
        run: |
          set -euo pipefail
          BASE="https://course-analytics-production-974e741c.up.railway.app"
          status=$(curl --retry 4 --retry-delay 2 -sS -o /tmp/health -w '%{http_code}' "$BASE/health")
          test "$status" = "200"
          grep -qx 'ok' /tmp/health
          status=$(curl --retry 4 --retry-delay 2 -sS -o /tmp/admin -w '%{http_code}' "$BASE/admin")
          test "$status" = "200"
          grep -q '访客分析' /tmp/admin
          status=$(curl --retry 4 --retry-delay 2 -sS -o /tmp/tracker -w '%{http_code}' "$BASE/tracker.js")
          test "$status" = "200"
          grep -q 'CourseAnalytics' /tmp/tracker
      - name: Verify production website retained original functionality and added consent
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -fsS "https://course-planner-publish-production.up.railway.app/" -o /tmp/course.html
          python3 - <<'CHECK'
          from pathlib import Path
          content=Path('/tmp/course.html').read_text('utf-8')
          print("HTML length",len(content),"tail",repr(content[-250:]),"end tags",content.lower().count("</body"),content.lower().count("</html"),flush=True)
          for needle in ['BUILT_CURRENT_SPRING','hbAMlCk','analytics-opt-in','course_analytics_consent_v1','manual-entry','assist-run','survey-confirm']:
              print(needle,'found' if needle in content else 'MISSING',flush=True)
              assert needle in content, needle
          CHECK
          python3 - <<'PY'
          import re
          src=open('/tmp/course.html',encoding='utf-8').read()
          matches=re.findall(r'<script id="analytics-opt-in">([\\s\\S]*?)</script>',src)
          assert len(matches)==1, f"consent script count {len(matches)}"
          open('/tmp/consent.js','w').write(matches[0])
          print('Production consent script extracted:',len(matches[0]))
          PY
          node --check /tmp/consent.js
      - name: Verify anonymous event can be written
        run: |
          set -euo pipefail
          BASE="https://course-analytics-production-974e741c.up.railway.app"
          status=$(curl -sS -o /tmp/response -w '%{http_code}' -X POST "$BASE/api/track" -H 'Origin: https://course-planner-publish-production.up.railway.app' -H 'Content-Type: text/plain' --data '{"visitor":"qa-smoke-20261118","session":"qa-smoke-session-20261118","type":"page_view","path":"/qa-smoke"}')
          cat /tmp/response
          test "$status" = "204"
          echo "Anonymous event accepted and persisted (204)"
