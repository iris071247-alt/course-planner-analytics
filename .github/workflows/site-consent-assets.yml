name: Check production analytics consent assets
on:
  push:
    paths:
      - ".github/workflows/site-consent-assets.yml"
  workflow_dispatch:
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify production consent, tracker and backend
        run: |
          set -euo pipefail
          BASE=https://course-analytics-production-974e741c.up.railway.app
          for path in /health /admin /tracker.js /site-consent.js /site-consent.css; do
            code=$(curl --retry 6 --retry-delay 2 -sS -o /tmp/$(basename "$path") -w '%{http_code}' "$BASE$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          mv /tmp/site-consent.js /tmp/consent-valid.js
          mv /tmp/tracker.js /tmp/tracker-valid.js
          node --check /tmp/consent-valid.js
          node --check /tmp/tracker-valid.js
          grep -q 'course_planner_analytics_consent_v2' /tmp/consent-valid.js
          grep -q 'cp-preview-consent' /tmp/consent-valid.js
          echo 'PASS: production backend assets are ready for externally injected consent'
