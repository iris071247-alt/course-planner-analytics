name: Production Chromium release regression
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/production-browser.yml"
      - "tests/production-browser.mjs"
jobs:
  chromium-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - name: Confirm production and preview are healthy
        run: |
          set -euo pipefail
          for url in https://course-planner-publish-production.up.railway.app/health https://course-analytics-production-974e741c.up.railway.app/health https://course-preview-preview.up.railway.app/health; do
            code=$(curl --retry 5 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url $code"
            test "$code" = 200
          done
      - name: Real Chromium production release regression
        run: node tests/production-browser.mjs
      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-consent-browser-screenshots
          path: production-consent-*.png
          if-no-files-found: ignore
